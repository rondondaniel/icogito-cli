[project]
name = "icogito"
version = "0.2.1"
description = "A modern Python CLI framework to build Agent/Multi-Agents systems"
readme = "README.md"
authors = [
    { name = "Daniel Rondon", email = "hello@danielrondon.com" }
]
requires-python = ">=3.12"
dependencies = [
    "graphifyy>=0.9.67",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pydantic-ai-harness>=0.34.0",
    "pydantic-ai-slim[openrouter]>=2.57.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "tavily-python>=0.8.4",
    "typer>=0.27.2",
]

[project.optional-dependencies]
prefect = [
  "prefect",
]
test = [
  "pytest>=8.0.0",
  "pytest-mock>=3.12.0",
]

[project.scripts]
icogito = "icogito.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.14,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tavily", "tavily.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]
