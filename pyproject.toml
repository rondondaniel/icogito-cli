[project]
name = "icogito-cli"
version = "0.1.0"
description = "A modern Python CLI framework to build Agent/Multi-Agents systems"
readme = "README.md"
authors = [
    { name = "Daniel Rondon", email = "hello@danielrondon.com" }
]
requires-python = ">=3.12"
dependencies = [
    "graphifyy>=0.9.67",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.48.0",
    "pydantic-ai-harness>=0.34.0",
    "tavily-python>=0.8.4",
    "typer>=0.27.2",
]

[project.scripts]
icogito-cli = "icogito_cli.cli:app"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
