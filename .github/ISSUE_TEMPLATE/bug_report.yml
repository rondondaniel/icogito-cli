name: Bug Report
description: Create a report to help us improve icogito-cli
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Execute '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Please paste any relevant logs or error output.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant environment information.
      value: |
        - OS: [e.g. macOS, Linux, Windows]
        - Python version: [e.g. 3.12.2]
        - `icogito-cli` version: [e.g. 0.1.0]
        - `uv` version: [e.g. 0.5.0]
    validations:
      required: true
